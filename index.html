<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Black Labz Summer Days — Transport Schedule</title>
<meta name="theme-color" content="#0a0a0a">

<style>
  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --ink:#f5f5f5;
    --ink-dim:#8a8a8a;
    --line:#262626;
    --white:#ffffff;
    --amber:#f5a623;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Inter', "Segoe UI", sans-serif;
    min-height:100%;
    overscroll-behavior-y:none;
  }
  body{-webkit-font-smoothing:antialiased; padding-bottom:60px;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric:tabular-nums;}

  .topbar{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; gap:10px;
    padding:calc(14px + var(--safe-top)) 18px 14px;
    background:rgba(10,10,10,0.92); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar .logo-mark{width:30px; height:30px;}
  .topbar .logo-mark img{width:100%; height:100%; object-fit:contain;}
  .topbar .title{font-weight:800; font-size:14px; letter-spacing:0.02em; text-transform:uppercase;}
  .topbar .sub{font-size:10.5px; color:var(--ink-dim); margin-top:1px;}

  .wrap{max-width:640px; margin:0 auto; padding:18px 16px 40px;}

  .day-tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:1; text-align:center; white-space:nowrap;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    padding:11px 14px; border-radius:12px; font-weight:700; font-size:13px;
  }
  .day-tab.active{background:var(--white); color:var(--bg); border-color:var(--white);}

  .leg-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 16px; margin-bottom:10px;
    display:flex; gap:14px; align-items:flex-start;
  }
  .leg-time{
    font-family:'IBM Plex Mono', monospace; font-weight:800; font-size:15px;
    color:var(--amber); min-width:52px; padding-top:1px;
  }
  .leg-body{flex:1; min-width:0;}
  .leg-activity{font-weight:700; font-size:14.5px; line-height:1.35;}
  .leg-details{font-size:12.5px; color:var(--ink-dim); margin-top:4px; line-height:1.4;}
  .leg-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .leg-tag{
    font-size:10.5px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase;
    background:rgba(255,255,255,0.06); border:1px solid var(--line);
    padding:4px 8px; border-radius:20px; color:var(--ink-dim);
  }
  .leg-tag.people{color:#7ec8e3;}
  .leg-tag.logistics{color:#f5a623;}
  .leg-tag.status{color:#2ecc59;}
  .leg-actions{display:flex; flex-direction:column; gap:6px;}
  .icon-btn{
    background:none; border:none; color:var(--ink-dim); padding:4px;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border-radius:8px;
  }
  .icon-btn:hover{color:var(--ink); background:rgba(255,255,255,0.06);}
  .icon-btn svg{width:16px; height:16px;}

  .add-row-btn{
    width:100%; margin-top:6px;
    background:none; border:1.5px dashed var(--line); color:var(--ink-dim);
    padding:14px; border-radius:14px; font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .add-row-btn:hover{border-color:var(--ink-dim); color:var(--ink);}

  .empty-day{
    text-align:center; color:var(--ink-dim); font-size:13px;
    padding:40px 20px; border:1px dashed var(--line); border-radius:12px;
  }

  .ask-tanel{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; color:var(--ink); margin-top:24px;
  }
  .ask-tanel svg{width:20px; height:20px; flex-shrink:0;}
  .ask-tanel .at-title{font-weight:800; font-size:13.5px;}
  .ask-tanel .at-sub{font-size:11px; color:var(--ink-dim); margin-top:2px; font-family:'IBM Plex Mono', monospace;}

  .sync-note{text-align:center; font-size:10.5px; color:var(--ink-dim); margin-top:16px; font-family:'IBM Plex Mono', monospace;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,0.6);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    width:100%; max-width:640px;
    background:var(--bg); border:1px solid var(--line); border-radius:20px 20px 0 0;
    padding:22px 18px calc(22px + var(--safe-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{font-size:16px; font-weight:800; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-dim); margin-bottom:6px; font-weight:700;}
  .field input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--ink); font-size:14px;
  }
  .field input:focus{outline:none; border-color:var(--ink-dim);}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{
    flex:1; padding:14px; border-radius:12px; border:none; font-weight:800; font-size:13px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn-save{background:var(--white); color:var(--bg);}
  .btn-cancel{background:var(--panel); color:var(--ink); border:1px solid var(--line) !important;}
  .btn-delete{background:none; color:#e05555; border:1px solid rgba(224,85,85,0.3) !important; margin-top:8px; width:100%;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:12px 18px; border-radius:30px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:2000;
  }
  .toast.show{opacity:1;}
</style>
</head>

    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function uid(){ return 'leg-' + Date.now() + '-' + Math.random().toString(36).slice(2,7); }

  async function loadSchedule(){
    try{
      const res = await fetch('/api/schedule');
      const json = await res.json();
      schedule = json.data || {};
      DAYS.forEach(d => { if(!schedule[d]) schedule[d] = []; });
      renderDay();
      if(json.updatedAt){
        const d = new Date(json.updatedAt);
        syncNote.textContent = 'Last updated ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      } else {
        syncNote.textContent = 'Default schedule — not yet edited';
      }
    }catch(err){
      syncNote.textContent = 'Could not load schedule — check connection';
      console.error(err);
    }
  }

  async function saveSchedule(){
    syncNote.textContent = 'Saving…';
    try{
      const res = await fetch('/api/schedule', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(schedule)
      });
      if(!res.ok) throw new Error('Save failed');
      const now = new Date();
      syncNote.textContent = 'Saved · ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }catch(err){
      syncNote.textContent = 'Could not save — try again';
      showToast('Save failed, check connection');
      console.error(err);
    }
  }

  function renderDay(){
    dayTabs.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', t.dataset.day === currentDay));
    const legs = (schedule[currentDay] || []).slice().sort((a,b)=> (a.time||'').localeCompare(b.time||''));
    if(!legs.length){
      legList.innerHTML = '<div class="empty-day">No transport legs yet for this day.</div>';
      return;
    }
    legList.innerHTML = legs.map(leg => `
      <div class="leg-card">
        <div class="leg-time mono">${escapeHtml(leg.time)}</div>
        <div class="leg-body">
          <div class="leg-activity">${escapeHtml(leg.activity)}</div>
          ${leg.details ? `<div class="leg-details">${escapeHtml(leg.details)}</div>` : ''}
          <div class="leg-meta">
            ${leg.people ? `<span class="leg-tag people">${escapeHtml(leg.people)}</span>` : ''}
            ${leg.logistics ? `<span class="leg-tag logistics">${escapeHtml(leg.logistics)}</span>` : ''}
            ${leg.status ? `<span class="leg-tag status">${escapeHtml(leg.status)}</span>` : ''}
          </div>
        </div>
        <div class="leg-actions">
          <button class="icon-btn" data-edit="${leg.id}">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    `).join('');

    legList.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModal(btn.dataset.edit));
    });
  }

  dayTabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('.day-tab');
    if(!btn) return;
    currentDay = btn.dataset.day;
    renderDay();
  });

  const EDITOR_KEY = 'bl_transport_editor';
  const EDIT_PASSWORD = 'tanel2026';

  function isEditor(){
    try{ return localStorage.getItem(EDITOR_KEY) === 'yes'; }catch(e){ return false; }
  }

  function requestEditorAccess(){
    if(isEditor()) return true;
    const pw = prompt('Enter password to edit the schedule:');
    if(pw === null) return false;
    if(pw.trim() === EDIT_PASSWORD){
      try{ localStorage.setItem(EDITOR_KEY, 'yes'); }catch(e){}
      return true;
    }
    showToast('Wrong password');
    return false;
  }

  function openModal(id){
    if(!requestEditorAccess()) return;
    editingId = id;
    const isNew = !id;
    modalTitle.textContent = isNew ? 'Add transport' : 'Edit transport';
    let leg = { time:'', activity:'', details:'', people:'', logistics:'', status:'' };
    if(!isNew){
      leg = (schedule[currentDay] || []).find(l => l.id === id) || leg;
    }
    document.getElementById('fTime').value = leg.time || '';
    document.getElementById('fActivity').value = leg.activity || '';
    document.getElementById('fDetails').value = leg.details || '';
    document.getElementById('fPeople').value = leg.people || '';
    document.getElementById('fLogistics').value = leg.logistics || '';
    document.getElementById('fStatus').value = leg.status || '';
    document.getElementById('btnDelete').style.display = isNew ? 'none' : 'block';
    modalOverlay.classList.add('open');
  }

  function closeModal(){
    modalOverlay.classList.remove('open');
    editingId = null;
  }

  document.getElementById('addRowBtn').addEventListener('click', ()=> openModal(null));
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) closeModal(); });

  document.getElementById('btnSave').addEventListener('click', async ()=>{
    if(!isEditor()) { closeModal(); return; }
    const leg = {
      id: editingId || uid(),
      time: document.getElementById('fTime').value.trim(),
      activity: document.getElementById('fActivity').value.trim(),
      details: document.getElementById('fDetails').value.trim(),
      people: document.getElementById('fPeople').value.trim(),
      logistics: document.getElementById('fLogistics').value.trim(),
      status: document.getElementById('fStatus').value.trim(),
    };
    if(!leg.activity){
      showToast('Please add a route / activity');
      return;
    }
    if(!schedule[currentDay]) schedule[currentDay] = [];
    const idx = schedule[currentDay].findIndex(l => l.id === leg.id);
    if(idx >= 0) schedule[currentDay][idx] = leg;
    else schedule[currentDay].push(leg);

    closeModal();
    renderDay();
    await saveSchedule();
    showToast('Saved');
  });

  document.getElementById('btnDelete').addEventListener('click', async ()=>{
    if(!isEditor()) { closeModal(); return; }
    if(!editingId) return;
    schedule[currentDay] = (schedule[currentDay] || []).filter(l => l.id !== editingId);
    closeModal();
    renderDay();
    await saveSchedule();
    showToast('Deleted');
  });

  loadSchedule();
</script>

</body>
</html>
