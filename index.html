const DIFF = { 1: { label: "Easy", color: "#4ade80", bg: "rgba(74,222,128,0.15)" }, 2: { label: "Medium", color: "#fbbf24", bg: "rgba(251,191,36,0.15)" }, 3: { label: "Hard", color: "#f87171", bg: "rgba(248,113,113,0.15)" } };
const AWARDS = ["🎭 Funniest Video", "💡 Most Creative", "🫣 Most Awkward Moment"];
const SK = "bl-challenges-v4";
const PW_KEY = "bl-auth-v1";
const PW = "blsummerdays2026";
const EMOJIS = ["🎯","🔥","⚡","🌟","🎪","🏆","🎲","🧩","🪂","🎭","🤯","💀","👑","🦄","🫡"];

function App() {
  // ALL hooks first — React rules
  const [authed, setAuthed] = useState(() => localStorage.getItem(PW_KEY) === "true");
  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState(false);
  const [tab, setTab] = useState("challenges");
  const [players, setPlayers] = useState([]);
  const [comp, setComp] = useState({});
  const [imgs, setImgs] = useState({});
  const [customCh, setCustomCh] = useState([]);
  const [nn, setNn] = useState("");
  const [sel, setSel] = useState(null);
  const [exp, setExp] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showAddCh, setShowAddCh] = useState(false);
  const [newChTitle, setNewChTitle] = useState("");
  const [newChDesc, setNewChDesc] = useState("");
  const [newChPts, setNewChPts] = useState(2);
  const [loaded, setLoaded] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [gv, setGv] = useState(null);
  const fr = useRef(null);
  const pc = useRef(null);
  const selRef = useRef(null);
  useEffect(()=>{ selRef.current = sel; }, [sel]);

  async function fetchProofs(){
    try{
      const r = await fetch('/api/proof-list');
      const d = await r.json();
      const map = {};
      (d.proofs||[]).forEach(p => { map[p.player+":"+p.challengeId] = p.url; });
      setImgs(map);
    }catch(e){ console.error(e); }
  }

  async function fetchState(){
    try{
      const r = await fetch('/api/state');
      const d = await r.json();
      const data = d.data || {};
      setPlayers(data.players || []);
      setComp(data.comp || {});
      setCustomCh(data.customCh || []);
      if((data.players||[]).length > 0 && !selRef.current) setSel(data.players[0]);
    }catch(e){ console.error(e); }
  }

  async function saveState(next){
    try{
      await fetch('/api/state', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(next)
      });
    }catch(e){ console.error(e); }
  }

  useEffect(() => {
    (async () => {
      await Promise.all([fetchState(), fetchProofs()]);
      setLoaded(true);
    })();
    const t1 = setInterval(fetchState, 8000);
    const t2 = setInterval(fetchProofs, 15000);
    return () => { clearInterval(t1); clearInterval(t2); };
  }, []);

  // Password check
  const checkPw = () => {
    if (pwInput === PW) { localStorage.setItem(PW_KEY, "true"); setAuthed(true); }
    else { setPwError(true); setTimeout(() => setPwError(false), 1500); }
  };

  // PASSWORD SCREEN
  if (!authed) return (
    <div style={{fontFamily:"'Inter',system-ui,sans-serif",maxWidth:480,margin:"0 auto",background:"#0a0a0a",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <img src={LOGO} alt="BL" style={{height:56,marginBottom:16}} />
      <h1 style={{margin:0,fontSize:20,fontWeight:700,color:"#fff",letterSpacing:1}}>BL Summer Days 2026</h1>
      <p style={{margin:"4px 0 32px",fontSize:13,color:"#555",letterSpacing:2}}>CHALLENGES</p>
      <input type="password" value={pwInput} onChange={e=>setPwInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkPw()} placeholder="Enter password" autoFocus style={{width:"100%",maxWidth:280,padding:"12px 16px",borderRadius:10,border:pwError?"1.5px solid #f87171":"1px solid #333",background:"#141414",color:"#fff",fontSize:15,textAlign:"center",boxSizing:"border-box",outline:"none"}} />
      <button onClick={checkPw} style={{marginTop:12,width:"100%",maxWidth:280,padding:"12px",borderRadius:10,border:"none",background:"#fff",color:"#000",fontSize:14,fontWeight:600,cursor:"pointer"}}>Enter</button>
      {pwError && <p style={{color:"#f87171",fontSize:13,marginTop:12}}>Wrong password</p>}
    </div>
  );

  // MAIN APP LOGIC
  const allCh = [...DEFAULT_CH, ...customCh];
  const total = allCh.reduce((s,c) => s + c.pts, 0);

  const addP = () => {
    const n=nn.trim(); if(!n||players.includes(n)) return;
    const nextPlayers = [...players, n];
    const nextComp = {...comp, [n]: []};
    setPlayers(nextPlayers); setComp(nextComp);
    if(!sel) setSel(n);
    setNn(""); setShowAdd(false);
    saveState({players: nextPlayers, comp: nextComp, customCh});
  };
  const remP = (n) => {
    if(!confirm("Remove "+n+"?")) return;
    const nextPlayers = players.filter(x=>x!==n);
    const nextComp = {...comp}; delete nextComp[n];
    setPlayers(nextPlayers); setComp(nextComp);
    setImgs(p=>{const x={...p};Object.keys(x).forEach(k=>{if(k.startsWith(n+":"))delete x[k];});return x;});
    if(sel===n) setSel(nextPlayers[0]||null);
    saveState({players: nextPlayers, comp: nextComp, customCh});
  };

  const addChallenge = () => {
    const t = newChTitle.trim(); if (!t) return;
    const id = "c" + Date.now();
    const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const nextCustomCh = [...customCh, { id, title: t, desc: newChDesc.trim() || t, pts: newChPts, emoji }];
    setCustomCh(nextCustomCh);
    setNewChTitle(""); setNewChDesc(""); setNewChPts(2); setShowAddCh(false);
    saveState({players, comp, customCh: nextCustomCh});
  };
  const remChallenge = (id) => {
    if (!confirm("Remove this challenge?")) return;
    const nextCustomCh = customCh.filter(c => c.id !== id);
    const nextComp = {...comp};
    Object.keys(nextComp).forEach(p => { nextComp[p] = nextComp[p].filter(x => x !== id); });
    setCustomCh(nextCustomCh);
    setComp(nextComp);
    saveState({players, comp: nextComp, customCh: nextCustomCh});
  };

  const handleFile = (e) => {
    const f=e.target.files[0]; if(!f||!sel||!pc.current) return;
    const cId=pc.current; const rd=new FileReader();
    rd.onload=(ev)=>{
      const im=new Image();
      im.onload=()=>{
        const cv=document.createElement("canvas");
        const s=Math.min(1,900/im.width);
        cv.width=im.width*s; cv.height=im.height*s;
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        setUploading(true);
        cv.toBlob(async (blob) => {
          try{
            const res = await fetch('/api/proof-upload', {
              method: 'POST',
              headers: {'Content-Type':'image/jpeg', 'X-Player': encodeURIComponent(sel), 'X-Challenge-Id': encodeURIComponent(cId)},
              body: blob
            });
            const data = await res.json();
            if(res.ok && data.url){
              setImgs(p=>({...p,[sel+":"+cId]:data.url}));
              const nextComp = {...comp};
              const c = nextComp[sel]||[];
              if(!c.includes(cId)) nextComp[sel] = [...c, cId];
              setComp(nextComp);
              saveState({players, comp: nextComp, customCh});
            } else {
              alert(data.error || 'Upload failed, try again');
            }
          }catch(err){ console.error(err); alert('Upload failed, try again'); }
          setUploading(false);
          setExp(null);
        }, "image/jpeg", 0.75);
      };
      im.src=ev.target.result;
    };
    rd.readAsDataURL(f); e.target.value="";
  };
  const upload = (id) => { pc.current=id; fr.current?.click(); };
  const remComp = (p,id) => {
    const nextComp = {...comp, [p]: (comp[p]||[]).filter(x=>x!==id)};
    setComp(nextComp);
    setImgs(x=>{const y={...x};delete y[p+":"+id];return y;});
    saveState({players, comp: nextComp, customCh});
  };
  const pts = (p) => (comp[p]||[]).reduce((s,id)=>s+(allCh.find(c=>c.id===id)?.pts||0),0);
  const lb = () => [...players].sort((a,b)=>pts(b)-pts(a));

  if (!loaded) return <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh",background:"#0a0a0a",color:"#fff",fontFamily:"system-ui"}}>Loading...</div>;

  return (
    <div style={{fontFamily:"'Inter',system-ui,sans-serif",maxWidth:480,margin:"0 auto",background:"#0a0a0a",minHeight:"100vh",color:"#e5e5e5"}}>
      <input type="file" accept="image/*,video/*" capture="environment" ref={fr} onChange={handleFile} style={{display:"none"}} />

      {/* Header */}
      <div style={{background:"#0a0a0a",padding:"24px 20px 16px",borderBottom:"1px solid #222",textAlign:"center"}}>
        <img src={LOGO} alt="BL" style={{height:48,marginBottom:8}} />
        <h1 style={{margin:0,fontSize:20,fontWeight:700,color:"#fff",letterSpacing:1}}>BL Summer Days 2026</h1>
        <p style={{margin:"2px 0 0",fontSize:14,fontWeight:500,color:"#888",letterSpacing:2}}>CHALLENGES</p>
        <p style={{margin:"6px 0 0",fontSize:11,color:"#555"}}>{allCh.length} challenges · {total} points · prove it or it didn't happen</p>
      </div>

      {/* Player selector */}
      <div style={{padding:"10px 16px",background:"#111",borderBottom:"1px solid #222",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:"#666",fontWeight:500}}>Player:</span>
        {players.map(p=>(
          <button key={p} onClick={()=>setSel(p)} style={{padding:"3px 10px",borderRadius:16,border:sel===p?"1.5px solid #fff":"1px solid #333",background:sel===p?"#222":"transparent",fontSize:12,fontWeight:sel===p?600:400,color:sel===p?"#fff":"#888",cursor:"pointer"}}>{p} <span style={{fontSize:10,opacity:0.5}}>{pts(p)}</span></button>
        ))}
        <button onClick={()=>setShowAdd(true)} style={{width:24,height:24,borderRadius:12,border:"1px dashed #444",background:"none",fontSize:14,color:"#666",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      </div>

      {/* Add player modal */}
      {showAdd && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget)setShowAdd(false)}}>
          <div style={{background:"#1a1a1a",borderRadius:16,padding:24,width:"100%",maxWidth:340,border:"1px solid #333"}}>
            <h3 style={{margin:"0 0 16px",fontSize:16,color:"#fff"}}>Add Player</h3>
            <input value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addP()} placeholder="Name" autoFocus style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #333",background:"#0a0a0a",color:"#fff",fontSize:15,boxSizing:"border-box"}} />
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button onClick={()=>setShowAdd(false)} style={{flex:1,padding:"10px",borderRadius:8,border:"1px solid #333",background:"transparent",color:"#888",fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={addP} style={{flex:1,padding:"10px",borderRadius:8,border:"none",background:"#fff",color:"#000",fontSize:14,fontWeight:600,cursor:"pointer"}}>Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Add challenge modal */}
      {showAddCh && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget)setShowAddCh(false)}}>
          <div style={{background:"#1a1a1a",borderRadius:16,padding:24,width:"100%",maxWidth:340,border:"1px solid #333"}}>
            <h3 style={{margin:"0 0 16px",fontSize:16,color:"#fff"}}>Add Challenge</h3>
            <input value={newChTitle} onChange={e=>setNewChTitle(e.target.value)} placeholder="Challenge title" autoFocus style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #333",background:"#0a0a0a",color:"#fff",fontSize:15,boxSizing:"border-box",marginBottom:8}} />
            <input value={newChDesc} onChange={e=>setNewChDesc(e.target.value)} placeholder="Description (optional)" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #333",background:"#0a0a0a",color:"#fff",fontSize:14,boxSizing:"border-box",marginBottom:8}} />
            <div style={{display:"flex",gap:6,marginBottom:12}}>
              {[1,2,3].map(v=>(
                <button key={v} onClick={()=>setNewChPts(v)} style={{flex:1,padding:"8px",borderRadius:8,border:newChPts===v?"1.5px solid "+DIFF[v].color:"1px solid #333",background:newChPts===v?DIFF[v].bg:"transparent",color:newChPts===v?DIFF[v].color:"#888",fontSize:13,fontWeight:600,cursor:"pointer"}}>{v}pt {v===1?"Easy":v===2?"Medium":"Hard"}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowAddCh(false)} style={{flex:1,padding:"10px",borderRadius:8,border:"1px solid #333",background:"transparent",color:"#888",fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={addChallenge} style={{flex:1,padding:"10px",borderRadius:8,border:"none",background:"#fff",color:"#000",fontSize:14,fontWeight:600,cursor:"pointer"}}>Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Gallery modal */}
      {gv && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setGv(null)}>
          <div style={{maxWidth:"90vw",maxHeight:"80vh"}}>
            <img src={gv.src} style={{maxWidth:"100%",maxHeight:"75vh",borderRadius:8}} />
            <p style={{color:"#aaa",textAlign:"center",margin:"8px 0 0",fontSize:13}}>{gv.player} — {gv.challenge}</p>
          </div>
        </div>
      )}

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:"1px solid #222",background:"#0a0a0a",position:"sticky",top:0,zIndex:10}}>
        {[["challenges","Challenges"],["leaderboard","Leaderboard"],["gallery","Gallery"],["manage","Players"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"12px 4px",border:"none",borderBottom:tab===k?"2px solid #fff":"2px solid transparent",background:"none",fontSize:12,fontWeight:tab===k?600:400,color:tab===k?"#fff":"#555",cursor:"pointer",letterSpacing:0.5}}>{l}</button>
        ))}
      </div>

      {/* CHALLENGES TAB */}
      {tab==="challenges" && (
        <div style={{padding:"12px 16px"}}>
          {!sel && <div style={{textAlign:"center",padding:40,color:"#555"}}>Add a player first using the + button above</div>}
          {sel && allCh.map(ch=>{
            const done=(comp[sel]||[]).includes(ch.id); const d=DIFF[ch.pts]||DIFF[2]; const proof=imgs[sel+":"+ch.id]; const ex=exp===ch.id;
            const cnt=Object.values(comp).filter(c=>c.includes(ch.id)).length;
            const isCustom = ch.id.toString().startsWith("c");
            return (
              <div key={ch.id} onClick={()=>setExp(ex?null:ch.id)} style={{background:"#141414",borderRadius:12,marginBottom:8,border:done?"1.5px solid "+d.color:"1px solid #222",overflow:"hidden",cursor:"pointer"}}>
                <div style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:22,flexShrink:0}}>{done?"✅":ch.emoji}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,color:done?d.color:"#e5e5e5"}}>{ch.title}</div>
                    <div style={{fontSize:11,color:"#555",marginTop:1}}>{cnt}/{players.length} completed{isCustom?" · custom":""}</div>
                  </div>
                  <span style={{padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:600,background:d.bg,color:d.color}}>{ch.pts}pt</span>
                </div>
                {ex && (
                  <div style={{padding:"0 14px 14px",borderTop:"1px solid #222"}} onClick={e=>e.stopPropagation()}>
                    <p style={{fontSize:13,color:"#888",margin:"10px 0",lineHeight:1.5}}>{ch.desc}</p>
                    {proof && <div style={{marginBottom:10}}><img src={proof} style={{width:"100%",maxHeight:200,objectFit:"cover",borderRadius:8}} onClick={()=>setGv({src:proof,player:sel,challenge:ch.title})} /></div>}
                    <div style={{display:"flex",gap:8}}>
                      {!done ? (
                        <button disabled={uploading} onClick={()=>upload(ch.id)} style={{flex:1,padding:"10px",borderRadius:8,border:"none",background:uploading?"#555":"#fff",color:uploading?"#aaa":"#000",fontSize:13,fontWeight:600,cursor:uploading?"default":"pointer"}}>{uploading?"Uploading…":"📷 Upload Proof"}</button>
                      ) : (<>
                        <button disabled={uploading} onClick={()=>upload(ch.id)} style={{flex:1,padding:"10px",borderRadius:8,border:"1px solid #333",background:"transparent",color:"#888",fontSize:13,cursor:uploading?"default":"pointer"}}>{uploading?"Uploading…":"Replace"}</button>
                        <button onClick={()=>remComp(sel,ch.id)} style={{padding:"10px 14px",borderRadius:8,border:"1px solid #5a2020",background:"rgba(248,113,113,0.1)",color:"#f87171",fontSize:13,cursor:"pointer"}}>Undo</button>
                      </>)}
                      {isCustom && <button onClick={()=>remChallenge(ch.id)} style={{padding:"10px 14px",borderRadius:8,border:"1px solid #5a2020",background:"rgba(248,113,113,0.1)",color:"#f87171",fontSize:13,cursor:"pointer"}}>🗑️</button>}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {sel && <button onClick={()=>setShowAddCh(true)} style={{width:"100%",padding:"14px",borderRadius:12,border:"1px dashed #444",background:"transparent",fontSize:14,color:"#888",cursor:"pointer",marginTop:4}}>+ Add Challenge</button>}
        </div>
      )}

      {/* LEADERBOARD TAB */}
      {tab==="leaderboard" && (
        <div style={{padding:"16px"}}>
          <div style={{background:"#141414",borderRadius:14,padding:20,marginBottom:16,border:"1px solid #222"}}>
            <div style={{fontSize:11,letterSpacing:2,color:"#555",marginBottom:12}}>STANDINGS</div>
            {lb().length===0 && <p style={{color:"#555",fontSize:14}}>No players yet</p>}
            {lb().map((p,i)=>{
              const pt=pts(p); const cn=(comp[p]||[]).length;
              const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+".";
              const barW=total>0?(pt/total)*100:0;
              const barC=i===0?"#fbbf24":i===1?"#94a3b8":i===2?"#d97706":"#555";
              return (
                <div key={p} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderTop:i>0?"1px solid #222":"none"}}>
                  <span style={{fontSize:i<3?20:14,width:30,textAlign:"center",flexShrink:0}}>{medal}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:i<3?600:400,color:"#fff"}}>{p}</div>
                    <div style={{background:"#222",borderRadius:4,height:6,marginTop:4,overflow:"hidden"}}><div style={{width:barW+"%",height:"100%",background:barC,borderRadius:4,transition:"width 0.3s"}} /></div>
                    <div style={{fontSize:11,color:"#555",marginTop:2}}>{cn}/{allCh.length} challenges</div>
                  </div>
                  <div style={{fontSize:20,fontWeight:700,color:"#fff",flexShrink:0}}>{pt}<span style={{fontSize:11,fontWeight:400,color:"#555"}}>/{total}</span></div>
                </div>
              );
            })}
          </div>
          <div style={{background:"#141414",borderRadius:14,padding:16,border:"1px solid #222"}}>
            <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:10,letterSpacing:1}}>SPECIAL AWARDS</div>
            {AWARDS.map((a,i)=>(<div key={i} style={{padding:"10px 0",borderTop:i>0?"1px solid #222":"none",display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>{a}</span><span style={{flex:1,borderBottom:"1px dashed #333"}} /></div>))}
          </div>
        </div>
      )}

      {/* GALLERY TAB */}
      {tab==="gallery" && (
        <div style={{padding:"16px"}}>
          {Object.keys(imgs).length===0 && <div style={{textAlign:"center",padding:40,color:"#555"}}>No proofs uploaded yet. Get going! 📸</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4}}>
            {Object.entries(imgs).map(([k,src])=>{
              const parts=k.split(":"); const player=parts[0]; const cId=parts[1]; const ch=allCh.find(c=>c.id===cId || c.id===parseInt(cId));
              return (
                <div key={k} onClick={()=>setGv({src,player,challenge:ch?.title||""})} style={{position:"relative",paddingBottom:"100%",borderRadius:6,overflow:"hidden",cursor:"pointer"}}>
                  <img src={src} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} />
                  <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.8))",padding:"16px 6px 4px"}}>
                    <div style={{fontSize:10,color:"#fff",fontWeight:500}}>{player}</div>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.5)"}}>{ch?.emoji} {ch?.title}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* MANAGE TAB */}
      {tab==="manage" && (
        <div style={{padding:"16px"}}>
          <button onClick={()=>setShowAdd(true)} style={{width:"100%",padding:"12px",borderRadius:10,border:"1px dashed #444",background:"transparent",fontSize:14,color:"#888",cursor:"pointer",marginBottom:12}}>+ Add Player</button>
          {players.map(p=>(
            <div key={p} style={{display:"flex",alignItems:"center",padding:"12px 14px",background:"#141414",borderRadius:10,marginBottom:6,border:"1px solid #222"}}>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:500,color:"#fff"}}>{p}</div><div style={{fontSize:12,color:"#555"}}>{(comp[p]||[]).length} completed · {pts(p)} pts</div></div>
              <button onClick={()=>remP(p)} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #5a2020",background:"rgba(248,113,113,0.1)",color:"#f87171",fontSize:12,cursor:"pointer"}}>Remove</button>
            </div>
          ))}
          {players.length>0 && <button onClick={()=>{if(confirm("Reset ALL data?")){setPlayers([]);setComp({});setImgs({});setCustomCh([]);setSel(null);saveState({players:[],comp:{},customCh:[]});}}} style={{width:"100%",marginTop:16,padding:"12px",borderRadius:10,border:"1px solid #5a2020",background:"rgba(248,113,113,0.1)",color:"#f87171",fontSize:13,cursor:"pointer"}}>Reset Everything</button>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
